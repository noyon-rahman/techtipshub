packages:
  - apps/*
  - packages/*

# Build scripts pnpm may run. The apps' allowances live here now that they
# share one store and one install.
allowBuilds:
  bcrypt: true
  esbuild: true
  "@heroui/shared-utils": true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nodemailer@10.2.0

# CVE-2026 cleaner: @tailwindcss/typography pins the vulnerable 6.x line.
# Only `.astSync()`/`.selector()` are used, both still supported in 7.
overrides:
  postcss-selector-parser@<7.1.6: ^7.1.6
