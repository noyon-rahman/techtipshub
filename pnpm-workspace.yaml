packages:
  - apps/*
  - packages/*

# A plain copy, not a link or a store symlink. Vercel traces the API function
# with @vercel/nft, which records every traced path as its real location in the
# pnpm store; the platform then reproduces the map and leaves out the link that
# makes the store addressable, so the function could not require its own
# dependencies. Copies trace where they sit, and every OS can make them.
package-import-method=copy

# Build scripts pnpm may run. The apps' allowances live here now that they
# share one store and one install.
allowBuilds:
  bcrypt: true
  esbuild: true
  '@heroui/shared-utils': true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nodemailer@10.2.0

# CVE-2026 cleaner: @tailwindcss/typography pins the vulnerable 6.x line.
# Only `.astSync()`/`.selector()` are used, both still supported in 7.
overrides:
  postcss-selector-parser@<7.1.6: ^7.1.6
